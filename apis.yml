name: Duplo Cloud
description: >-
  DuploCloud is an AI-native DevOps platform that automates cloud infrastructure
  provisioning, security, and compliance across AWS, Azure, GCP, and Kubernetes. Its
  ARMOR agent runtime lets teams build and run AI DevOps agents that create tickets,
  manage workspaces, environments, and providers, while continuously enforcing SOC 2,
  HIPAA, PCI-DSS, NIST, ISO, HITRUST, and FedRAMP controls. Developers work with the
  platform through a web UI, a REST API, the duploctl CLI/Python SDK, Terraform and
  Pulumi providers, a Claude Code plugin, an official MCP server, and Slack/Teams.
  Backed by Mayfield.
